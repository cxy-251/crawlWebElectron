# Deprecated compatibility config for twitter.extract-prompts.v1.
# Prefer the two-phase flow:
#   macrpa twitter collect --config configs/twitter.collect.example.yaml --input configs/twitter-target.example.json
#   macrpa twitter clean --config configs/twitter.clean.example.yaml --input configs/twitter-target.example.json
target:
  # Can be overridden by --input configs/twitter-target.example.json.
  handle: example

include:
  replies: false
  reposts: false
  quotes: false

period:
  granularity: week
  timezone: Asia/Shanghai

limits:
  # Quantity-first stop rule. The workflow also stops early after several
  # scrolls without newly discovered tweets.
  max_tweets: 50
  max_scrolls: 80
  max_no_new_rounds: 3

detail:
  detail_timeout_seconds: 15
  detail_pause_seconds: 2
  detail_retry_attempts: 2
  between_detail_seconds: 2
  max_consecutive_detail_timeouts: 3

llm:
  base_url: http://127.0.0.1:1234/v1
  model: gemma-4-12b-qat
  temperature: 0.2
  timeout_seconds: 60
  max_tokens: 2048
  retries: 1
  batch_size: 5
