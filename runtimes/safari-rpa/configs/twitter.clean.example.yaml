target:
  # Can be overridden by --input configs/twitter-target.example.json.
  handle: example

period:
  granularity: week
  timezone: Asia/Shanghai

llm:
  base_url: http://127.0.0.1:1234/v1
  model: gemma-4-12b-qat
  temperature: 0.2
  timeout_seconds: 60
  max_tokens: 2048
  retries: 1
  batch_size: 5
