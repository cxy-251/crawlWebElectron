  # run and daily limits remain below 110.
  per_city: 10
  max_pages: 10

ordering:
  strategy: random_rotated

communication:
  enabled: true

profiles:
  collection:
    communication:
      enabled: false
    limits:
      run: 110
  test:
    # At most ten new confirmed communications in this run. They count toward
    # the same 110-per-day ledger used by production.
    communication:
      enabled: true
    limits:
      run: 10
  production:
    # Test-profile communications already completed today are deducted from this
    # shared allowance.
    communication:
      enabled: true
    limits:
      run: 110
