  # Code-first sectors are rotated by date and city. Generic robot, firmware,
  # hardware, and field-integration searches are intentionally excluded.
  weekday_keywords:
    mon: [Linux系统开发, C++开发, 基础软件开发, 分布式系统开发, 中间件开发]
    tue: [AI应用开发, 大模型应用开发, AI平台开发, 推理引擎开发, 模型部署工程师]
    wed: [汽车软件开发, 智能座舱开发, 车载系统开发, AUTOSAR开发, QNX开发]
    thu: [图形开发, 渲染开发, GPU开发, OpenGL开发, Vulkan开发]
    fri: [工业软件开发, CAD开发, CAE开发, 仿真软件开发, 几何算法]
    sat: [HarmonyOS开发, Android开发, 客户端开发, Qt开发, 桌面端开发]
    sun: [音视频开发, 编解码开发, 计算机视觉, 图像处理, 多媒体开发]

