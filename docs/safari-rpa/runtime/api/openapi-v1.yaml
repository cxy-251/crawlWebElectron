openapi: 3.1.0
info:
  title: Safari RPA Runtime Local API
  version: 0.1.0
  description: Versioned loopback API shared by Electron and other local clients.
servers:
  - url: http://127.0.0.1:3211/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Browser and workflow capabilities
  /workflows:
    get:
      operationId: listWorkflows
      responses:
        "200":
          description: Registered workflows, including Boss and two-phase Twitter raw collection / prompt cleanup
  /runs:
    get:
      operationId: listRuns
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200": {description: Recent runs}
    post:
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "202": {description: Run accepted}
        "409": {description: Invalid or unavailable workflow}
  /runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": {description: Run state}
        "404": {description: Run not found}
  /runs/{run_id}:resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202": {description: Resume accepted}
        "409": {description: Run is not resumable}
  /runs/{run_id}:cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202": {description: Cancellation requested}
  /runs/{run_id}/artifacts:
    get:
      operationId: listArtifacts
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200": {description: Run artifacts}
  /runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
        - in: header
          name: Last-Event-ID
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: Resumable server-sent event stream
          content:
            text/event-stream:
              schema: {type: string}
  /reports:
    get:
      operationId: listReports
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        "200": {description: Registered stable reports}
  /reports/{report_id}:
    get:
      operationId: getReport
      parameters: [{$ref: "#/components/parameters/ReportId"}]
      responses:
        "200": {description: Report metadata}
        "404": {description: Report not found}
  /reports/{report_id}/content:
    get:
      operationId: getReportContent
      parameters: [{$ref: "#/components/parameters/ReportId"}]
      responses:
        "200":
          description: UTF-8 CSV report
          content:
            text/csv: {schema: {type: string}}
  /schedules:
    get:
      operationId: listSchedules
      responses:
        "200": {description: Registered LaunchAgent schedules}
  /schedules/{schedule_id}:
    get:
      operationId: getSchedule
      parameters: [{$ref: "#/components/parameters/ScheduleId"}]
      responses:
        "200": {description: Schedule state}
        "404": {description: Schedule not found}
    put:
      operationId: putSchedule
      parameters: [{$ref: "#/components/parameters/ScheduleId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PutScheduleRequest"}
      responses:
        "200": {description: LaunchAgent installed and schedule registered}
    delete:
      operationId: deleteSchedule
      parameters: [{$ref: "#/components/parameters/ScheduleId"}]
      responses:
        "200": {description: LaunchAgent unloaded and schedule deleted}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RunId:
      in: path
      name: run_id
      required: true
      schema: {type: string}
    ReportId:
      in: path
      name: report_id
      required: true
      schema: {type: string}
    ScheduleId:
      in: path
      name: schedule_id
      required: true
      schema: {type: string}
  schemas:
    CreateRunRequest:
      type: object
      required: [workflow_id]
      additionalProperties: false
      properties:
        workflow_id: {type: string}
        config: {type: object, additionalProperties: true, default: {}}
        input: {type: object, additionalProperties: true, default: {}}
    Run:
      type: object
      required: [id, workflow_id, status, config, input, cancel_requested, created_at, updated_at]
      properties:
        id: {type: string}
        workflow_id: {type: string}
        status:
          type: string
          enum: [pending, running, succeeded, failed, blocked, cancelled, unknown_side_effect]
        config: {type: object, additionalProperties: true}
        input: {type: object, additionalProperties: true}
        output: {type: [object, "null"], additionalProperties: true}
        error: {type: [object, "null"], additionalProperties: true}
        cancel_requested: {type: boolean}
        created_at: {type: number}
        updated_at: {type: number}
    Report:
      type: object
      required: [id, workflow_id, report_date, type, path, record_count, metadata, created_at, updated_at]
      properties:
        id: {type: string}
        workflow_id: {type: string}
        report_date: {type: string, format: date}
        type: {type: string}
        path: {type: string}
        record_count: {type: integer}
        metadata: {type: object, additionalProperties: true}
        created_at: {type: number}
        updated_at: {type: number}
    PutScheduleRequest:
      type: object
      properties:
        workflow_id: {type: string, default: boss.search-and-communicate.v1}
        config_path: {type: string}
        daily_at: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", default: "06:00"}
        timezone: {type: string, default: Asia/Shanghai}
        keep_awake: {type: boolean, default: true}
    Envelope:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        data: {}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            kind: {type: string}
            details: {type: object, additionalProperties: true}
    TwitterCollectRawV1:
      description: Read-only Twitter/X profile raw tweet collection. Uses Safari only and writes raw period artifacts.
      type: object
      properties:
        target:
          type: object
          properties:
            handle: {type: string}
            profile_url: {type: string}
        include:
          type: object
          properties:
            replies: {type: boolean, default: false}
            reposts: {type: boolean, default: false}
            quotes: {type: boolean, default: false}
        period:
          type: object
          properties:
            granularity: {type: string, default: week}
            timezone: {type: string, default: Asia/Shanghai}
            week: {type: string, description: Optional ISO week such as 2026-W26}
            start_date: {type: string, description: Optional inclusive YYYY-MM-DD range start}
            end_date: {type: string, description: Optional inclusive YYYY-MM-DD range end}
        limits:
          type: object
          properties:
            max_tweets: {type: integer, default: 50}
            max_scrolls: {type: integer, default: 80}
            max_no_new_rounds: {type: integer, default: 3}
        detail:
          type: object
          properties:
            detail_timeout_seconds: {type: number, default: 15}
            detail_pause_seconds: {type: number, default: 2}
            detail_retry_attempts: {type: integer, default: 2}
            between_detail_seconds: {type: number, default: 2}
            max_consecutive_detail_timeouts: {type: integer, default: 3}
    TwitterCleanPromptsV1:
      description: PromptLoom cleanup for previously collected Twitter/X raw tweets. Does not call Safari.
      type: object
      properties:
        target:
          type: object
          properties:
            handle: {type: string}
            profile_url: {type: string}
        period:
          type: object
          properties:
            granularity: {type: string, default: week}
            timezone: {type: string, default: Asia/Shanghai}
            week: {type: string, description: Optional ISO week such as 2026-W26}
            start_date: {type: string, description: Optional inclusive YYYY-MM-DD range start}
            end_date: {type: string, description: Optional inclusive YYYY-MM-DD range end}
        llm:
          type: object
          properties:
            base_url: {type: string, default: "http://127.0.0.1:1234/v1"}
            model: {type: string, default: local-model}
            temperature: {type: number, default: 0.2}
            timeout_seconds: {type: number, default: 60}
            max_tokens: {type: integer, default: 2048}
            retries: {type: integer, default: 1}
            batch_size: {type: integer, default: 5}
    TwitterExtractPromptsV1:
      description: Deprecated compatibility workflow that runs TwitterCollectRawV1 then TwitterCleanPromptsV1 in one run.
      deprecated: true
      allOf:
        - $ref: "#/components/schemas/TwitterCollectRawV1"
        - type: object
          properties:
            llm:
              $ref: "#/components/schemas/TwitterCleanPromptsV1/properties/llm"
